<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <p>Enter text or URL to generate QR code</p>
            <input type="text" id="qrText" placeholder="Enter text or URL">

            <div id="imgBox">
                <img src="" alt="" id="qrImage">
            </div>
        <button  onclick="generateQR()">Generate QR Code</button>

    </div>
    <script>

        let imgBox = document.getElementById("imgBox");
        let qrImage = document.getElementById("qrImage");
        let qrText = document.getElementById("qrText");

        function generateQR(){
            if(qrText.value.length > 0){
            qrImage.src = " https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=" + qrText.value;imgBox.classList.add("show-img");

            } else{
                qrText.classList.add("error");
                qrText.style.borderColor = "red";
                setTimeout(() => {
                    qrText.classList.remove("error");
                    qrText.style.borderColor = "#494eea";
                }, 2000);
            }
        }
    </script>
</body>
</html>
